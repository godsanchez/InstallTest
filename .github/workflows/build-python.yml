name: Build Python Projects

on:
  push:
    branches: [master]
    paths:
      - "$source_directory/**"
      - ".github/workflows/build-python.yml"
  workflow_dispatch:

env:
  source_directory: "src"

jobs:
  discover:
    name: Discover Python projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find pyproject.toml directories under src
        id: find
        run: |
          projects=$(find "$source_directory" -mindepth 1 -maxdepth 2 -name pyproject.toml -printf '%h\n' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          count=$(echo "$projects" | jq 'length')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count Python project(s):"
          echo "$projects" | jq -r '.[]'

  build:
    name: Build ${{ matrix.project }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: uv build

      - name: Compute artifact name
        id: slug
        run: echo "name=$(echo '${{ matrix.project }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.slug.outputs.name }}
          path: ${{ matrix.project }}/dist/*
          if-no-files-found: error
