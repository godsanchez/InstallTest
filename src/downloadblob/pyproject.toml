[project]
name = "downloadblob"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-identity",
    "azure-storage-blob",
    "msal",
    "msal-extensions",
    "requests",
    "rich",
]

[project.scripts]
downloadblob = "downloadblob:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["downloadblob.py"]
